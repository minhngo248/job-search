# This is the SAM template that represents the architecture of your serverless application
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-template-basics.html

# The AWSTemplateFormatVersion identifies the capabilities of the template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
AWSTemplateFormatVersion: 2010-09-09
Description: >-
  backend

# Transform section specifies one or more macros that AWS CloudFormation uses to process your template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/transform-section-structure.html
Transform:
- AWS::Serverless-2016-10-31

Parameters:
  AdzunaAppId:
    Type: String
    Description: Adzuna API App ID
    NoEcho: true
  AdzunaAppKey:
    Type: String
    Description: Adzuna API App Key
    NoEcho: true
  AllowedOrigin:
    Type: String
    Description: Allowed CORS origin for frontend
    Default: '*'
  
Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 100
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ''
        DYNAMODB_JOB_TABLE: !Ref JobTable
        DYNAMODB_USER_TABLE: !Ref UserTable

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: JobPouleUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  # Lambda function triggered after user confirmation
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.cognito.post_confirmation.handler
      Description: Automatically create user record in DynamoDB after Cognito signup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable

  # Permission for Cognito to invoke the Lambda
  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # User Pool Client (Required for frontend)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: JobPouleWebClient
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # Cognito User Pool Domain
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'job-poule-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  GetAllJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.api.get_all_jobs.handler
      Description: A simple example includes a HTTP get method to get all items from a DynamoDB table.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /jobs
            Method: GET

  GetByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.api.get_by_id.handler
      Description: A simple example includes a HTTP get method to get one item by id from a DynamoDB table.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /jobs/{id}
            Method: GET

  OptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.api.options.handler
      Description: Handle CORS preflight OPTIONS requests
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        JobsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /jobs
            Method: OPTIONS
        JobsByIdOptions:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /jobs/{id}
            Method: OPTIONS

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.service.lambda_handler.handler
      Description: A function that handles scheduled item creation
      Environment:
        Variables:
          ADZUNA_APP_ID: !Ref AdzunaAppId
          ADZUNA_APP_KEY: !Ref AdzunaAppKey
      MemorySize: 512
      Timeout: 600
      LoggingConfig: {}
      Policies:
        # Full CRUD access (includes BatchWrite)
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 7,19 * * ? *)"  # Both 7 AM and 7 PM
            Input: '{"endpoint_url": ""}'
            Description: "Job scraping twice daily"

  JobTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: pk
          AttributeType: S
        - AttributeName: published_date
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PublishedDatePkIndex
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: published_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization'"
        AllowOrigin: !Sub "${AllowedOrigin}"
        MaxAge: "'600'"

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub 'https://job-poule-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
  WebEndpoint:
    Description: API Gateway endpoint URL for prod stage
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'